<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RockyStudy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<title>RockyStudy</title>
<meta name="theme-color" content="#F6F7FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: eine Handy-Spalte (max 560px), feste Kopfzeile + Tab-Leiste unten, Lernsitzung als Vollbild-Ebene.
   Stil: Duolingo-Vibe = runde, kräftige Schrift, satte Flächen, "dicke" Knöpfe mit Lippe, Waschbär Rocky als Begleiter. */
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#EEF0F6; --line:#DFE2EC;
  --ink:#23263A; --ink-2:#5B6078; --ink-3:#666B84;
  --go:#2E8B0E; --go-lip:#1F6A07; --go-soft:#E3F5D6; --go-ink:#1F6A07;
  --again:#C8341B; --again-lip:#93250F; --again-soft:#FCE4DE; --again-ink:#9C2812;
  --hard:#FFB020; --hard-lip:#C98200; --hard-ink:#3A2400; --hard-soft:#FFF1D6;
  --easy:#1769B3; --easy-lip:#0F4F8A; --easy-soft:#E0EEFB;
  --accent:#1769B3; --flame:#E07A00;
  --fur:#A8907E; --fur-2:#D8C6B6; --fur-dark:#7B6253; --mask:#3B2C27; --face:#FFF8F0; --ear:#F2A7B8; --blush:#FF8FA8; --nose:#2A1D1A; --hoodie:#58CC02; --hoodie-2:#46A302;
  --s1:#CFEBBE; --s2:#7CC453; --s3:#2E8B0E; /* Fortschritt: neu → lernend → sicher (eine Farbe, hell → dunkel) */
  --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 16px rgba(20,24,40,.06);
  --f-display:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141D; --surface:#1C1F2B; --surface-2:#252938; --line:#343949;
  --ink:#F0F1F7; --ink-2:#A6ABC2; --ink-3:#8A8FA8;
  --go-soft:#1E3315; --go-ink:#8EDB5E; --again-soft:#3A1E19; --again-ink:#FF8F80; --hard-soft:#3A2C12; --easy-soft:#16283D;
  --accent:#5CB3FF; --flame:#FF9F2E; --fur-2:#CDB9A8; --face:#F6EDE3;
  --s1:#2C4A1E; --s2:#4F9A2A; --s3:#8EDB5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12141D; --surface:#1C1F2B; --surface-2:#252938; --line:#343949;
  --ink:#F0F1F7; --ink-2:#A6ABC2; --ink-3:#8A8FA8;
  --go-soft:#1E3315; --go-ink:#8EDB5E; --again-soft:#3A1E19; --again-ink:#FF8F80; --hard-soft:#3A2C12; --easy-soft:#16283D;
  --accent:#5CB3FF; --flame:#FF9F2E; --fur-2:#CDB9A8; --face:#F6EDE3;
  --s1:#2C4A1E; --s2:#4F9A2A; --s3:#8EDB5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.btn svg,.panel > svg,label.panel > svg{width:22px;height:22px;flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .btn{padding-inline:8px}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:900}
h2{font-size:22px;font-weight:900}
h3{font-size:18px;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:900;font-size:20px;margin-right:auto}
.brand svg{width:34px;height:34px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.chip.flame{color:var(--flame)}
.chip.flame.off{color:var(--ink-3)}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.iconbtn svg{width:22px;height:22px}

/* Hauptbereich */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:24px;padding-block:20px}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:800;cursor:pointer}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:2px solid transparent;border-radius:12px;background:none;cursor:pointer;font-size:12px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--easy-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}

/* Knöpfe mit Lippe */
.btn{--c:var(--go);--l:var(--go-lip);--t:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border:0;border-radius:var(--r);background:var(--c);color:var(--t);box-shadow:0 4px 0 var(--l);font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:transform .06s,box-shadow .06s;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--l)}
.btn[disabled]{--c:var(--surface-2);--l:var(--line);--t:var(--ink-3);cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{--c:var(--surface);--l:var(--line);--t:var(--accent);border:2px solid var(--line)}
.btn.blue{--c:var(--easy);--l:var(--easy-lip)}
.btn.red{--c:var(--again);--l:var(--again-lip)}
.btn.orange{--c:var(--hard);--l:var(--hard-lip);--t:var(--hard-ink)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1 1 140px}

/* Karten / Kacheln */
.panel{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}
.hero .mascot{width:112px;height:130px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;font-weight:700}
.bubble::before{content:"";position:absolute;left:-9px;top:28px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble strong{font-weight:900}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--ink-2);font-weight:700}

.deck{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.deck h3{overflow-wrap:anywhere}
.deck .meta{font-size:14px;color:var(--ink-2);font-weight:700;display:flex;gap:6px 12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:800;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.due{background:var(--easy-soft);color:var(--accent)}
.pill.new{background:var(--go-soft);color:var(--go-ink)}
.pill.warn{background:var(--hard-soft);color:var(--ink)}
.modes{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mode{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-weight:800;font-size:15px;min-width:0}
.mode svg{flex:none;width:24px;height:24px}
.mode small{display:block;font-weight:700;color:var(--ink-2);font-size:12px}
.mode:active{background:var(--surface-2)}

.banner{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--hard-soft);border:2px solid color-mix(in srgb,var(--hard) 55%,transparent);border-radius:var(--r);padding:12px}
.banner .mascot{width:64px;height:74px}

/* Formularfelder */
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:16px;font-weight:600;min-width:0}
textarea.input{min-height:96px;resize:vertical;line-height:1.45}
.input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--easy-soft);border-color:var(--accent);color:var(--accent)}
.hint{font-size:14px;color:var(--ink-2)}
code.k{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--surface-2);padding:1px 6px;border-radius:6px}

/* Kartenliste */
.search{display:flex;gap:8px}
.cardlist{display:flex;flex-direction:column;gap:8px}
.citem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.citem .q{font-weight:800;overflow-wrap:anywhere;min-width:0}
.citem .a{grid-column:1/-1;font-size:14px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.decktabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.decktabs::-webkit-scrollbar{display:none}
.decktabs button{flex:none;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.decktabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Ebenen: Blatt (Editor/Dialoge) und Vollbild (Lernen) */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;border:2px solid var(--line);border-bottom:0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.full{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.full .wrap{width:100%}
.s-top{display:flex;align-items:center;gap:12px;padding-block:12px}
.xbtn{width:40px;height:40px;border:0;background:none;color:var(--ink-3);display:grid;place-items:center;cursor:pointer;border-radius:10px}
.xbtn svg{width:26px;height:26px}
.bar{flex:1;height:16px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--go);border-radius:999px;transition:width .3s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.s-body{flex:1;overflow:auto}
.s-body .wrap{display:flex;flex-direction:column;gap:16px;padding-block:8px 24px}
.qcard{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:180px}
.qcard .kind{display:flex;align-items:center;gap:8px}
.qtext{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.3;overflow-wrap:anywhere;white-space:pre-wrap}
.atext{font-size:19px;font-weight:600;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap;border-top:2px dashed var(--line);padding-top:14px}
.qcard img{border-radius:12px;max-height:240px;object-fit:contain;align-self:flex-start;background:var(--surface-2)}
.cloze{display:inline-block;min-width:3.5em;padding:0 6px;border-radius:8px;background:var(--easy-soft);color:var(--accent);border-bottom:3px solid var(--accent)}
.cloze.filled{background:var(--go-soft);color:var(--go-ink);border-color:var(--go)}
.s-foot{border-top:2px solid var(--line);background:var(--bg)}
.s-foot .wrap{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.s-foot.ok{background:var(--go-soft);border-color:transparent}
.s-foot.part{background:var(--hard-soft);border-color:transparent}
.s-foot.bad{background:var(--again-soft);border-color:transparent}
.verdict{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:20px}
.verdict svg{width:30px;height:30px}
.s-foot.ok .verdict{color:var(--go-ink)} .s-foot.bad .verdict{color:var(--again-ink)} .s-foot.part .verdict{color:var(--ink)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:0;padding:8px 4px;min-height:60px;font-size:15px;letter-spacing:.02em}
.grades .btn small{font-size:12px;font-weight:800;opacity:.95;text-transform:none;letter-spacing:0}
.grades .btn.sugg{outline:3px solid var(--ink);outline-offset:3px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-family:var(--f-display)}

.done{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:24px}
.done .mascot{width:180px;height:200px}
.done .stat-row{width:100%}

/* Hörmodus */
.listen-now{display:flex;flex-direction:column;gap:12px;text-align:left}
.listen-now .phase{display:flex;align-items:center;gap:8px}
.listen-big{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.3;overflow-wrap:anywhere;white-space:pre-wrap}
.ctrls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--accent)}
.range output{min-width:4ch;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* Diagramme */
.chart{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;align-items:end;height:120px;padding-top:18px}
.chart .col{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.chart .b{width:100%;max-width:28px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.chart .b.zero{background:var(--line)}
.chart .v{font-size:12px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chart .x{font-size:11px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.chart .col:hover .b{filter:brightness(1.15)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%}
.stack i:first-child{border-radius:6px 0 0 6px}.stack i:last-child{border-radius:0 6px 6px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;font-weight:700;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:16px 8px}
.empty .mascot{width:130px;height:150px}
.sep{height:2px;background:var(--line);border:0;margin:0}
.danger{color:var(--again-ink)}
.mascot .arm-wave{transform-origin:84px 98px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.hero{grid-template-columns:84px 1fr}.hero .mascot{width:84px;height:98px}.grades .btn{font-size:13px}.qtext{font-size:21px}}
/* V2: Kurse, Unterstapel, Häkchen, Farben, Mikrofon */
.iconbtn.sm{width:36px;height:36px;border-radius:10px}
.iconbtn.sm svg{width:18px;height:18px}
.subs{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;border-top:2px dashed var(--line);padding-top:10px}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px}
.subname{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;font-weight:800;min-width:0;flex:1}
.subname span{overflow-wrap:anywhere}
.subname small{font-size:12px;color:var(--ink-2);font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.check > input{width:24px;height:24px;flex:none;margin:2px 0 0;accent-color:var(--go)}
.check > span{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0}
.check > span > svg{width:22px;height:22px;flex:none;margin-top:2px}
.check:has(input:disabled){opacity:.6;cursor:not-allowed}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.decktabs.sub{margin-top:-14px}
.decktabs.sub button{padding:6px 12px;font-size:13px}
.decktabs.sub button[aria-pressed="true"]{background:var(--easy-soft);color:var(--accent);border-color:var(--accent)}
.prompts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--ink-2);font-weight:700}
.btn.mic{align-self:flex-start;flex:none}

<script src="vendor/ts-fsrs.umd.js"></script>
<script>
"use strict";
/* Zoes Karten 2.0 – eine Datei, keine Abhängigkeiten außer ts-fsrs (Lernplan).
   Aufbau: Hilfsfunktionen → Speicher → Datenmodell (Kurse, Notizen, Karten) → Lernlogik → Ansichten → Lernen → Hörmodus → Start. */
/* ============ Hilfsfunktionen ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const DAY = 864e5;
const DAY_START_H = 4; // Tageswechsel um 4 Uhr wie bei Anki: Lernen nach Mitternacht zählt noch zum Vortag
const ymd = x => x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
const dkey = (d = new Date()) => ymd(new Date(+new Date(d) - DAY_START_H * 36e5));
const endOfToday = () => { const d = new Date(+new Date() - DAY_START_H * 36e5); d.setDate(d.getDate() + 1); d.setHours(DAY_START_H, 0, 0, 0); return new Date(+d - 1); };
const daysUntil = iso => { if (!iso) return null; const t = new Date(iso + "T00:00:00"); const n = new Date(dkey() + "T00:00:00"); return Math.round((t - n) / DAY); };
const fmtDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
const fmtShort = d => new Date(d).toLocaleDateString("de-DE", { day: "numeric", month: "numeric" });
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hash = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
function fmtIvl(due, now = new Date()) {
  const m = Math.max(1, Math.round((due - now) / 6e4));
  if (m < 60) return m + " Min.";
  const h = Math.round(m / 60); if (h < 24) return h + " Std.";
  const d = Math.round(m / 1440); if (d < 31) return d + (d === 1 ? " Tag" : " Tage");
  const mo = Math.round(d / 30.4); if (mo < 12) return mo + " Mon.";

}
let toastT;
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }
const isStandalone = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;

/* ============ Speicher (nur auf diesem Gerät) ============ */
const DEFAULT_SETTINGS = { newPerDay: 20, retention: 0.9, ttsRate: 1, pauseSec: 4, answerSec: 10, voiceURI: "", voiceCmd: false, voiceAnswer: false, listenOrder: "due", theme: "system", lastBackup: null, examSize: 20, examMin: 20, srBroken: null };
const COLORS = ["#2E8B0E", "#1769B3", "#C8341B", "#8A4FD8", "#E07A00", "#0E8C8C"];
let DB = null;
const Store = {
  idb: null,
  async open() {
    try {
      this.idb = await new Promise((res, rej) => { const r = indexedDB.open("zoes-karten", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    } catch (e) { this.idb = null; }
  },
  async load() {
    let raw = null;
    if (this.idb) { try { raw = await new Promise((res, rej) => { const t = this.idb.transaction("kv").objectStore("kv").get("db"); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); } catch (e) {} }
    try { const s = localStorage.getItem("zoes-karten"); if (s) { const ls = JSON.parse(s); if (!raw || (ls.savedAt || "") > (raw.savedAt || "")) raw = ls; } } catch (e) {}
    return raw;
  },
  saveSoon() { clearTimeout(this.t); this.t = setTimeout(() => this.save(), 300); },
  async save() {
    if (!DB) return; clearTimeout(this.t);
    DB.savedAt = new Date().toISOString();
    if (this.idb) { // IndexedDB kopiert selbst, das spart eine komplette JSON-Kopie pro Bewertung
      try { await new Promise((res, rej) => { const t = this.idb.transaction("kv", "readwrite"); t.objectStore("kv").put(DB, "db"); t.oncomplete = res; t.onerror = () => rej(t.error); }); try { localStorage.removeItem("zoes-karten"); } catch (e) {} return; } catch (e) {}
    }

  }
};

/* ============ Datenmodell ============
   Kurs = Stapel ohne parentId (Klausurdatum, Tageslimit, Farbe). Unterstapel = Stapel mit parentId.
   Notiz = was du schreibst (noteId). Karte = was abgefragt wird (key): "f" vorwärts, "r" umgedreht, "c1", "c2" … je Lücke. */
const CLOZE = /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;
const clozeNums = text => [...new Set([...String(text).matchAll(CLOZE)].map(m => +m[1]))].sort((a, b) => a - b);
const serCard = c => ({ ...c, due: new Date(c.due).toISOString(), last_review: c.last_review ? new Date(c.last_review).toISOString() : null });

const emptyFsrs = () => serCard(FSRS.createEmptyCard(new Date()));
function noteKeys(type, front, rev) {
  if (type === "cloze") return clozeNums(front).map(n => "c" + n);
  if (type === "basic" && rev) return ["f", "r"];
  return ["f"];
}
const notesOf = noteId => DB.cards.filter(c => c.noteId === noteId);
/* Legt die Karten einer Notiz an oder gleicht sie an. Lernstand bleibt pro Karte erhalten. */
function saveNote(n, opts = {}) {
  const noteId = n.noteId || uid(); const now = new Date().toISOString();
  const keys = noteKeys(n.type, n.front, n.rev);
  const old = notesOf(noteId);
  const base = { noteId, deckId: n.deckId, type: n.type, front: n.front, back: n.back, tags: n.tags || [], image: n.image ?? null, rev: !!n.rev, updated: now };
  const out = [];
  for (const key of keys) {
    let c = old.find(x => x.key === key);
    if (c) Object.assign(c, base);
    else { c = { id: uid(), key, created: now, ...base, fsrs: opts.fsrs ? { ...opts.fsrs } : emptyFsrs() }; if (n.sample) c.sample = true; DB.cards.push(c); }
    out.push(c);

  const drop = new Set(old.filter(c => !keys.includes(c.key)).map(c => c.id));
  if (drop.size) DB.cards = DB.cards.filter(c => !drop.has(c.id));

}
const deckById = id => DB.decks.find(d => d.id === id);
const courses = () => DB.decks.filter(d => !d.parentId || !deckById(d.parentId));
const subsOf = id => DB.decks.filter(d => d.parentId === id);
const courseOf = id => { const d = deckById(id); return d && d.parentId && deckById(d.parentId) ? deckById(d.parentId) : d; };
const deckIdsDeep = id => [id, ...subsOf(id).map(s => s.id)];
const deckLabel = id => { const d = deckById(id); if (!d) return ""; const p = d.parentId && deckById(d.parentId); return p ? p.name + " › " + d.name : d.name; };
const courseColor = id => { const c = courseOf(id); return c ? COLORS[(c.color ?? 0) % COLORS.length] : COLORS[0]; };
function addDeck(name, parentId = null) {
  const ex = DB.decks.find(d => d.name.toLowerCase() === name.toLowerCase() && (d.parentId || null) === parentId); if (ex) return ex;
  const d = { id: uid(), name, parentId, examDate: null, newPerDay: null, color: parentId ? null : courses().length % COLORS.length };
  DB.decks.push(d); return d;
}
/* Anki-Pfad "Kurs::Kapitel::Teil" → Kurs + Unterstapel "Kapitel / Teil" */
function deckFromPath(path, fallback) {
  const parts = String(path || "").split("::").map(s => s.trim()).filter(Boolean);
  if (!parts.length) return addDeck(fallback);
  const course = addDeck(parts[0]);
  return parts.length > 1 ? addDeck(parts.slice(1).join(" / "), course.id) : course;
}
function freshDB(withSample) {
  const db = { v: 2, decks: [], cards: [], log: [], daily: {}, exams: [], redo: null, settings: { ...DEFAULT_SETTINGS }, sample: !!withSample };
  if (withSample) {
    DB = db;
    const k = { id: "beispiel", name: "Beispiel: So geht die App", parentId: null, examDate: null, newPerDay: null, color: 1 }; db.decks.push(k);
    const s = { id: "beispiel-sub", name: "Lernplan", parentId: "beispiel", examDate: null, newPerDay: null, color: null }; db.decks.push(s);
    const mk = (deckId, front, back, type = "basic", tags = [], rev = false) => saveNote({ deckId, front, back, type, tags, rev, sample: true });
    mk(k.id, "Was bedeutet die Taste „Gut“?", "Du wusstest die Antwort nach kurzem Nachdenken. Rocky plant die Karte dann in ein paar Tagen wieder ein.", "basic", ["Bedienung"]);
    mk(k.id, "Wann drückst du „Nochmal“?", "Wenn du die Antwort nicht wusstest. Die Karte kommt noch in dieser Sitzung zurück. Vertippt? Oben gibt es Rückgängig.", "basic", ["Bedienung"]);
    mk(s.id, "Karten, die du sicher kannst, siehst du {{c1::seltener}}, schwierige {{c2::öfter}}.", "Jede Lücke ist eine eigene Karte mit eigenem Lernplan.", "cloze", ["Lernplan"]);
    mk(s.id, "Verteilte Wiederholung", "Lernstoff in wachsenden Abständen wiederholen statt alles am Stück zu pauken.", "basic", ["Lernplan"], true);
    mk(k.id, "Warum liegen deine Karten nur auf diesem Handy?", "Damit keine Kursinhalte öffentlich auf GitHub landen. Deshalb regelmäßig ein Backup in der Dateien-App speichern.", "warum", ["Datenschutz"]);
    mk(k.id, "Wie kommen deine Anki-Karten in die App?", "Unter Karten → Importieren die .txt-Datei aus Anki auswählen. Stapel wie Kurs::Kapitel werden zu Kurs und Unterstapel.", "basic", ["Bedienung"]);
    mk(k.id, "Wofür ist der Hörmodus?", "Zum Lernen ohne Hinsehen: Frage, Denkpause oder deine gesprochene Antwort, dann die richtige Antwort.", "basic", ["Bedienung"]);
  }

}
/* V1 → V2: Kurse, Notizen, eine Karte pro Lücke */
function migrate(db) {
  db.settings = { ...DEFAULT_SETTINGS, ...(db.settings || {}) };
  db.exams ||= []; db.log ||= []; db.daily ||= {};
  if ((db.v || 1) >= 2) return db;
  db.decks.forEach((d, i) => { if (d.parentId === undefined) d.parentId = null; if (d.color === undefined) d.color = i % COLORS.length; });
  const out = [];
  for (const c of db.cards) {
    c.noteId ||= c.id; c.rev ||= false;
    if (c.type === "cloze") {
      const nums = clozeNums(c.front);
      if (!nums.length) { c.type = "basic"; c.key = "f"; out.push(c); continue; }
      nums.forEach((n, i) => out.push(i === 0 ? Object.assign(c, { key: "c" + n }) : { ...c, id: uid(), key: "c" + n, fsrs: { ...c.fsrs } }));
    } else { c.key ||= "f"; out.push(c); }
  }
  db.cards = out; db.v = 2;

}

/* ============ Kartentexte ============ */
function renderCloze(text, cn, revealed) {
  let out = "", last = 0, m; const re = new RegExp(CLOZE.source, "g");
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index));
    if (+m[1] === cn) out += revealed ? `<span class="cloze filled">${esc(m[2])}</span>` : `<span class="cloze">${m[3] ? esc(m[3]) : "&nbsp;?&nbsp;"}</span>`;
    else out += esc(m[2]);
    last = re.lastIndex;
  }
  return out + esc(text.slice(last));
}
const cnOf = c => c.type === "cloze" ? +String(c.key).slice(1) : 0;
const plainCloze = t => String(t).replace(CLOZE, "$2");
const qHTML = (c, revealed) => c.type === "cloze" ? renderCloze(c.front, cnOf(c), revealed) : esc(c.key === "r" ? c.back : c.front);
const aPlain = c => c.type === "cloze" ? c.back : c.key === "r" ? c.front : c.back;
function answerText(c) { // was in der Lücke bzw. auf der Rückseite steht, für den Antwort-Vergleich
  if (c.type !== "cloze") return aPlain(c);
  return [...c.front.matchAll(CLOZE)].filter(m => +m[1] === cnOf(c)).map(m => m[2]).join(" ");
}
const speakFront = c => c.type === "cloze" ? c.front.replace(CLOZE, (_, n, a, h) => +n === cnOf(c) ? (h ? "Lücke, Tipp: " + h : "Lücke") : a) : (c.key === "r" ? c.back : c.front);
const speakBack = c => c.type === "cloze" ? (c.back ? plainCloze(c.front).replace(/[.!?:;]\s*$/, "") + ". " + c.back : plainCloze(c.front)) : aPlain(c);
const listFront = c => c.type === "cloze" ? c.front.replace(CLOZE, "[$2]") : c.front;
const kindLabel = c => c.type === "cloze" ? "Lücke " + cnOf(c) : c.type === "warum" ? "Warum-Frage" : c.key === "r" ? "Umgedreht" : "Karte";

/* Antwort-Vergleich (getippt oder gesprochen). Nur ein Vorschlag, du entscheidest. */
const STOP = new Set(["der", "die", "das", "und", "oder", "ein", "eine", "einer", "eines", "einem", "einen", "dem", "den", "des", "mit", "von", "für", "auf", "ist", "sind", "wird", "werden", "zum", "zur", "bei", "aus", "auch", "als", "wie", "sich", "dass", "the", "and", "of", "to", "in", "im", "an", "am", "es", "er", "sie", "wir", "man"]);
const NEG = /(^|[^\p{L}])(nicht|kein|keine|keinen|keiner|keinem|keines|nie|niemals|not|no)(?=$|[^\p{L}])/u;
function normWords(s) {
  const raw = String(s).replace(/<[^>]+>/g, " ");
  return raw.split(/[^\p{L}\p{N}]+/u).filter(Boolean).map(w => ({ w: w.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss"), abbr: w.length >= 2 && w === w.toUpperCase() && /\p{L}/u.test(w) }))
    .filter(x => (x.w.length > 2 || x.abbr || /\d/.test(x.w)) && !STOP.has(x.w)).map(x => x.w);
}
function lev(a, b) { if (Math.abs(a.length - b.length) > 2) return 3; const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }

function similarity(typed, answer) {

  return score;
}
const suggestFrom = (typed, c) => { if (!String(typed).trim()) return R.Again; const s = similarity(typed, answerText(c)); return s >= .7 ? R.Good : s >= .35 ? R.Hard : R.Again; };

/* ============ Lernlogik ============ */
const S = window.FSRS?.State || {}, R = window.FSRS?.Rating || {};
const schedCache = {};

  const newLeft = q.filter(c => c.fsrs.state === S.New).length, due = q.length - newLeft; // genau das, was „Lernen“ heute abfragt
  const st = { neu: 0, lernend: 0, sicher: 0 }; cards.forEach(c => st[cardStatus(c)]++);
  return { total: cards.length, due, fresh, newLeft, st, leech: cards.filter(c => c.leech && !c.susp).length };
}
function suggestedPace(course) {
  const left = daysUntil(course.examDate); if (left == null || left <= 0) return null;
  const ids = deckIdsDeep(course.id);

  const learnDays = left > 10 ? left - 7 : Math.max(1, left - 1); // sonst: letzte Woche nur wiederholen

  const redo = DB.redo?.day === today_ ? new Set(DB.redo.ids) : new Set();

  if (DB.settings.voiceCmd || DB.settings.voiceAnswer) { DB.settings.voiceCmd = false; DB.settings.voiceAnswer = false; }

/* Hört einmal zu. Liefert { text, err }. onPartial zeigt Zwischenergebnisse. */
function recognizeOnce(ms, { lang = "de-DE", onPartial } = {}) {

    rec.onstart = rec.onaudiostart = () => { alive = true; };
    rec.onresult = e => { alive = true; interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalT += r[0].transcript + " "; else interim += r[0].transcript; } onPartial?.((finalT + interim).trim()); };

function bindMic(btn, ta, after) {
  if (!btn || !ta) return;
  btn.onclick = async () => {
    if (btn.classList.contains("on")) return;
    btn.classList.add("on"); btn.querySelector("span").textContent = "Ich höre zu …";
    const base = ta.value.trim();
    const r = await recognizeOnce(20000, { onPartial: t => { ta.value = (base ? base + " " : "") + t; ta.dispatchEvent(new Event("input")); } });
    btn.classList.remove("on"); btn.querySelector("span").textContent = "Sprechen";
    if (r.err && r.err !== null) { toast(srFail(r.err), 6000); btn.hidden = true; return; }
    if (r.text) { ta.value = (base ? base + " " : "") + r.text; ta.dispatchEvent(new Event("input")); after?.(); }

}

  return [...notes.values()];
}

function examLine(d) {

function barChart(rows) {
  const max = Math.max(1, ...rows.map(r => r.v));
  const showVal = (r, i) => r.v > 0 && (r.v === max || i === rows.length - 1 || rows.length <= 7);
  return `<div class="chart" role="img" aria-label="${esc(rows.map(r => r.t).join("; "))}">${rows.map((r, i) => `<div class="col" title="${esc(r.t)}"><span class="v">${showVal(r, i) ? r.v : ""}</span><i class="b ${r.v ? "" : "zero"}" style="height:${r.v ? Math.max(4, r.v / max * 80) : 2}px"></i><span class="x">${esc(r.x)}</span></div>`).join("")}</div>`;
}

function shrinkImage(file) {

}

function parseDelimited(text, sep) {

    else if (ch === sep) { row.push(f); f = ""; }
    else if (ch === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (ch !== "\r") f += ch;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}

  const html = head.html ? head.html.toLowerCase() === "true" : /<br\s*\/?>|<div>|<b>/i.test(body);

}

      const pre = DB.settings.voiceAnswer && srUsable() && !LS.micErr ? (LS.said ? { 3: "Klingt richtig. ", 2: "Teilweise. ", 1: "Nicht ganz. " }[LS.sugg] + "Die Antwort: " : "Ich habe nichts gehört. Die Antwort: ") : "";

    if (LS.phase === "cmd") {
      LS.heard = ""; drawListen();

      LS.phase = "next";
    }
    if (LS.phase === "next") { if (!await wait(1000, tok)) return; LS.i++; resetCardLS(); }
  }
  if (LS && tok === LS.token) { await speak("Das waren alle Karten. Gut gemacht!", tok); stopListen(true); }
}

/* ============ Weiterlernen, wenn der Plan für heute geschafft ist ============ */
const scopeIds = scope => scope === "all" ? DB.decks.map(d => d.id) : deckIdsDeep(scope);
function todayBlock() {
  const k = dkey();
  const studied = new Set(DB.log.filter(l => dkey(new Date(l.at)) === k).map(l => l.c));
  const notes = new Set(DB.cards.filter(c => studied.has(c.id)).map(c => c.noteId));
  return { studied, notes };
}
const oneNote = list => { const seen = new Set(); return list.filter(c => !seen.has(c.noteId) && seen.add(c.noteId)); };
/* Neue Karten, die heute noch dazukommen könnten (eine pro Notiz, keine Geschwister von heute) */
function freshAvail(ids) {
  const queued = new Set(buildQueue(ids)); const { notes } = todayBlock();
  const qNotes = new Set(DB.cards.filter(c => queued.has(c.id)).map(c => c.noteId));
  return oneNote(DB.cards.filter(c => ids.includes(c.deckId) && active(c) && c.fsrs.state === S.New && !notes.has(c.noteId) && !qNotes.has(c.noteId))
    .sort((a, b) => a.created.localeCompare(b.created) || a.key.localeCompare(b.key)));
}
/* Vorlernen: Karten, die in den nächsten n Tagen fällig wären */
function aheadPool(ids, days) {
  const eod = endOfToday(), lim = new Date(+eod + days * DAY); const { studied, notes } = todayBlock();
  return oneNote(DB.cards.filter(c => ids.includes(c.deckId) && active(c) && c.fsrs.state !== S.New && !studied.has(c.id) && !notes.has(c.noteId) && new Date(c.fsrs.due) > eod && new Date(c.fsrs.due) <= lim)
    .sort((a, b) => new Date(a.fsrs.due) - new Date(b.fsrs.due)));
}
function practicePool(ids, kind) {
  const all = DB.cards.filter(c => ids.includes(c.deckId) && active(c));
  if (kind === "weak") {
    const now = new Date(); const sch = schedulerFor(DB.settings.retention);
    return all.filter(c => c.fsrs.state !== S.New).map(c => ({ c, r: sch.get_retrievability(desCard(c.fsrs), now, false) }))
      .sort((a, b) => a.r - b.r || b.c.fsrs.lapses - a.c.fsrs.lapses).slice(0, 20).map(x => x.c);
  }
  if (kind === "random") return shuffle(all).slice(0, 20);
  if (kind === "forgot") { const k = dkey(); const ids2 = new Set(DB.log.filter(l => l.r === R.Again && dkey(new Date(l.at)) === k).map(l => l.c)); return shuffle(all.filter(c => ids2.has(c.id))); }
  return shuffle(all);
}
function moreSheet(scope = "all", mode = "flip") {
  if (scope !== "all" && !deckById(scope)) scope = "all";
  const opt = (id, label) => `<option value="${id}" ${id === scope ? "selected" : ""}>${label}</option>`;
  const modes = [["flip", "Aufdecken"], ["type", "Antworten"], ["explain", "Erklären"]];
  sheet(`<div class="sheet-head"><h2>Weiterlernen</h2><button class="xbtn" data-act="closeSheet" aria-label="Schließen">${I.x}</button></div>
  <p class="small muted">${buildQueue(DB.decks.map(d => d.id)).length ? "Zusätzlich zu deinem Plan für heute:" : "Dein Plan für heute ist geschafft. Du kannst trotzdem weitermachen, so viel du willst."}</p>
  <label class="field"><span>Was</span><select class="input" id="mScope">${opt("all", "Alle Kurse")}${courses().map(c => opt(c.id, esc(c.name)) + subsOf(c.id).map(s => opt(s.id, "&nbsp;&nbsp;↳ " + esc(s.name))).join("")).join("")}</select></label>
  <div class="field"><span>Wie</span><div class="seg" id="mMode">${modes.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === mode}">${l}</button>`).join("")}</div></div>
  <div id="mOpts" class="section" style="gap:10px"></div>`, s => {
    const draw = () => {
      const ids = scopeIds(scope); const fresh = freshAvail(ids).length;
      const a3 = aheadPool(ids, 3).length, a7 = aheadPool(ids, 7).length;
      const learned = DB.cards.filter(c => ids.includes(c.deckId) && active(c) && c.fsrs.state !== S.New).length;
      const all = DB.cards.filter(c => ids.includes(c.deckId) && active(c)).length;
      const forgot = practicePool(ids, "forgot").length;
      const b = (attrs, label, n, dis) => `<button class="btn sm ${dis ? "ghost" : ""}" ${attrs} ${dis ? "disabled" : ""}>${label}${n != null ? `<small>${n}</small>` : ""}</button>`;
      $("#mOpts", s).innerHTML = `
      <div class="more-opt"><h3>Neue Karten dazunehmen</h3><p class="small muted">${fresh ? `Noch ${plural(fresh, "neue Karte", "neue Karten")} verfügbar. Zählt für deinen Lernplan wie normale neue Karten.` : "Keine neuen Karten mehr übrig (oder nur Geschwister von Karten, die du heute schon hattest)."}</p>
        <div class="row">${(fresh ? [...[5, 10, 20].filter(n => n < fresh), ...(fresh <= 20 ? [fresh] : [])] : [5, 10, 20]).map(n => b(`data-more="new" data-n="${n}"`, "+" + n, null, !fresh)).join("")}</div></div>

        <div class="row">${b(`data-more="ahead" data-n="3"`, "Nächste 3 Tage", a3, !a3)}${b(`data-more="ahead" data-n="7"`, "Nächste 7 Tage", a7, !a7)}</div></div>
      <div class="more-opt"><h3>Freies Üben</h3><p class="small muted">So oft du willst, dein Lernplan bleibt unverändert. Gut zum Festigen vor der Klausur.</p>
        <div class="grid2">${b(`data-more="free" data-k="weak"`, "Schwächste", Math.min(20, learned), !learned)}${b(`data-more="free" data-k="random"`, "Zufällig", Math.min(20, all), !all)}${b(`data-more="free" data-k="forgot"`, "Heute vergessen", forgot, !forgot)}${b(`data-more="free" data-k="all"`, "Alle", all, !all)}</div></div>`;
    };
    draw();
    $("#mScope", s).onchange = e => { scope = e.target.value; draw(); };
    $("#mMode", s).onclick = e => { const x = e.target.closest("button"); if (!x) return; mode = x.dataset.v; s.querySelectorAll("#mMode button").forEach(y => y.setAttribute("aria-pressed", y === x)); };
    $("#mOpts", s).onclick = e => {
      const x = e.target.closest("[data-more]"); if (!x || x.disabled) return;
      const ids = scopeIds(scope); SES_ALL = false;
      if (x.dataset.more === "new") {
        let need = +x.dataset.n; const avail = freshAvail(ids); const per = {};
        avail.forEach(c => { const co = courseOf(c.deckId); if (co) per[co.id] = (per[co.id] || 0) + 1; });
        const order = Object.keys(per).sort((a, b) => (deckById(a).examDate || "9999").localeCompare(deckById(b).examDate || "9999"));
        if (DB.extraNew?.day !== dkey()) DB.extraNew = { day: dkey(), by: {} };
        for (const id of order) { if (need <= 0) break; const g = Math.min(need, per[id]); DB.extraNew.by[id] = (DB.extraNew.by[id] || 0) + g; need -= g; }
        Store.saveSoon(); closeSheet(); startSession(ids, mode, { scope });
      } else if (x.dataset.more === "ahead") {
        closeSheet(); startSession(ids, mode, { scope, queue: aheadPool(ids, +x.dataset.n).map(c => c.id), kind: "ahead" });
      } else {
        closeSheet(); startSession(ids, mode, { scope, queue: practicePool(ids, x.dataset.k).map(c => c.id), free: true });
      }
    };
  });
}

/* ============ Fortschritt ============ */
let statRange = "7";

function rangeKeys() {

    <p class="small">Schon gesehen: <strong>${learned.length} von ${mine.length}</strong> Karten (${pct(learned.length, mine.length) ?? 0} %)${rNow != null ? ` · jetzt abrufbar (Schätzung): <strong>${rNow} %</strong>` : ""}${ok != null ? ` · in Wiederholungen gewusst (30 Tage): <strong>${ok} %</strong>` : ""}</p>
    ${prog}
    ${hard.length ? `<div class="hardlist"><span class="small muted">Am häufigsten vergessen</span>${hard.map(x => `<button class="citem" data-act="editCard" data-id="${x.id}"><span class="q">${esc(listFront(x))}</span><span class="pill warn">${x.fsrs.lapses}× vergessen</span><span class="a">${esc(x.back)}</span></button>`).join("")}</div>` : ""}
    ${c.leech ? `<p class="small">${plural(c.leech, "Problemkarte", "Problemkarten")} · <button class="link" data-act="showLeeches">ansehen</button></p>` : ""}
    ${examLine(d)}
    ${d.examDate ? `<p class="small muted">Klausur ${fmtDate(d.examDate)}${daysUntil(d.examDate) >= 0 ? `, noch ${plural(daysUntil(d.examDate), "Tag", "Tage")}` : ""}</p>` : ""}</div>`;
}
/* Lernkalender: 18 Wochen, eine Spalte pro Woche (Mo oben), Farbe = Anzahl Karten (bewertet + frei geübt) */
function heatmap() {
  const W = 18; const t = new Date(+new Date() - DAY_START_H * 36e5); t.setHours(12, 0, 0, 0);
  const start = new Date(t); start.setDate(start.getDate() - ((start.getDay() + 6) % 7) - (W - 1) * 7);
  const cells = []; let max = 0; const months = [];
  for (let w = 0; w < W; w++) for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + w * 7 + i); const k = ymd(d);
    const day = DB.daily[k]; const v = (day?.reviews || 0) + (day?.practice || 0); if (d <= t) max = Math.max(max, v);
    cells.push({ d, k, v, future: d > t });
    if (i === 0) months.push(d.getDate() <= 7 ? d.toLocaleDateString("de-DE", { month: "short" }) : "");
  }
  const lvl = v => !v ? 0 : v <= max / 3 ? 1 : v <= max * 2 / 3 ? 2 : 3;
  return `<div class="heat-months" style="grid-template-columns:22px repeat(${W},1fr)"><span></span>${months.map(m => `<span>${m}</span>`).join("")}</div>
  <div class="heat-wrap"><div class="heat-days"><span>Mo</span><span></span><span>Mi</span><span></span><span>Fr</span><span></span><span>So</span></div>
  <div class="heat" style="grid-template-columns:repeat(${W},1fr)" role="img" aria-label="Lernkalender der letzten ${W} Wochen, ${Object.keys(DB.daily).filter(learnedOn).length} Lerntage">${cells.map(c => c.future ? `<i class="f"></i>` : `<i class="l${lvl(c.v)}" title="${c.d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" })}: ${plural(c.v, "Karte", "Karten")}"></i>`).join("")}</div></div>
  <div class="heat-legend"><span>weniger</span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><span>mehr</span></div>`;
}
function gradeBar(logs) {
  if (!logs.length) return `<p class="small muted">In diesem Zeitraum noch keine Bewertungen.</p>`;
  const g = [[R.Again, "Nochmal", "var(--again)"], [R.Hard, "Schwer", "var(--hard)"], [R.Good, "Gut", "var(--go)"], [R.Easy, "Einfach", "var(--easy)"]].map(([r, l, col]) => ({ l, col, n: logs.filter(x => x.r === r).length }));
  const tot = logs.length;
  return `<div class="gbar" role="img" aria-label="${g.map(x => `${x.l} ${x.n}`).join(", ")}">${g.filter(x => x.n).map(x => `<i style="flex:${x.n};background:${x.col}" title="${x.l}: ${x.n} (${pct(x.n, tot)} %)"></i>`).join("")}</div>
  <div class="legend">${g.map(x => `<span><i style="background:${x.col}"></i>${x.l} ${x.n} (${pct(x.n, tot)} %)</span>`).join("")}</div>
  ${pct(g[0].n, tot) > 25 ? `<p class="small">Viele „Nochmal“: Karten kürzer machen oder vorher die Vorlesung nachlesen hilft meist mehr als stures Wiederholen.</p>` : ""}`;
}
function weekStart(d) { const x = new Date(+new Date(d) - DAY_START_H * 36e5); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function weeklyOk() {
  const ws = weekStart(new Date()); const rows = [];
  for (let i = 7; i >= 0; i--) {
    const a = new Date(ws); a.setDate(a.getDate() - i * 7); const b = new Date(a); b.setDate(b.getDate() + 7);
    const ls = DB.log.filter(l => l.s === S.Review && (() => { const w = weekStart(l.at); return +w === +a; })());
    const p = ls.length >= 5 ? pct(ls.filter(l => l.r !== R.Again).length, ls.length) : 0;
    rows.push({ x: i === 0 ? "diese" : a.getDate() + "." + (a.getMonth() + 1) + ".", v: p, t: `Woche ab ${a.toLocaleDateString("de-DE")}: ${ls.length >= 5 ? `${p} % gewusst (${ls.length} Wiederholungen)` : "zu wenig Wiederholungen für eine Quote"}` });
  }
  return rows.some(r => r.v) ? barChart(rows) : `<p class="small muted">Sobald du in einer Woche mindestens 5 Wiederholungen hattest, siehst du hier deine Quote.</p>`;
}
function dayTime(rev) {
  const B = [["morgens", h => h >= 5 && h < 11], ["mittags", h => h >= 11 && h < 14], ["nachmittags", h => h >= 14 && h < 18], ["abends", h => h >= 18 && h < 23], ["nachts", h => h >= 23 || h < 5]];
  const st = B.map(([l, f]) => { const ls = rev.filter(x => f(new Date(x.at).getHours())); return { l, n: ls.length, p: pct(ls.filter(x => x.r !== R.Again).length, ls.length) }; }).filter(x => x.n >= 10);
  if (st.length < 2) return "";
  const best = st.sort((a, b) => b.p - a.p)[0];
  return `<p class="small">Am besten weißt du es <strong>${best.l}</strong>: ${best.p} % gewusst (${best.n} Wiederholungen). ${st.slice(1).map(x => `${x.l} ${x.p} %`).join(", ")}.</p>`;
}
function activityChart() {
  const rows = [];
  if (statRange !== "all") {
    const n = +statRange;
    for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const day = DB.daily[dkey(d)]; const v = (day?.reviews || 0) + (day?.practice || 0); const m = Math.round((day?.ms || 0) / 6e4);
      rows.push({ x: i === 0 ? "heute" : n > 7 && i % 5 ? "" : n > 7 ? d.getDate() + "." : d.toLocaleDateString("de-DE", { weekday: "short" }), v, t: `${d.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "numeric" })}: ${plural(day?.reviews || 0, "Karte", "Karten")} bewertet${day?.practice ? `, ${day.practice} frei geübt` : ""}${m ? `, ${m} Min.` : ""}` }); }
  } else {
    const keys = Object.keys(DB.daily).filter(learnedOn).sort(); if (!keys.length) return `<p class="small muted">Noch nichts gelernt.</p>`;
    const first = weekStart(new Date(keys[0] + "T12:00")); const last = weekStart(new Date());
    const nW = Math.min(26, Math.round((last - first) / (7 * DAY)) + 1);
    for (let i = nW - 1; i >= 0; i--) { const a = new Date(last); a.setDate(a.getDate() - i * 7); let v = 0, m = 0;
      for (let j = 0; j < 7; j++) { const d = new Date(a); d.setDate(d.getDate() + j); const day = DB.daily[ymd(d)]; v += (day?.reviews || 0) + (day?.practice || 0); m += day?.ms || 0; }
      rows.push({ x: nW > 8 && i % 4 ? "" : a.getDate() + "." + (a.getMonth() + 1) + ".", v, t: `Woche ab ${a.toLocaleDateString("de-DE")}: ${plural(v, "Karte", "Karten")}, ${Math.round(m / 6e4)} Min.` }); }
  }
  return barChart(rows);
}
ACT.more = d => moreSheet(d.id || "all", d.mode || "flip");
ACT.statRange = d => { statRange = d.v; render(); };
